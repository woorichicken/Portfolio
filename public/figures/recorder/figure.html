@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

// 기록계의 세계 치수와 움직임 모형 — 빌드(Node)와 페이지(live.js)가 이 파일 하나를 같이 쓴다.
// 페이지에는 `export ` 를 떼고 그대로 들어가므로 import 를 쓰지 않는다.
// 모든 값은 t(0~1) 하나의 순수 함수다 — 같은 t 면 같은 그림(영상 frame→t, 웹 scroll→t).

const W = {
  AZIMUTH: 58,
  ELEVATION: 30,
  BASE: { x: -150, y: -68, w: 300, d: 136, r: 8 },
  BASE_H: 10,
  FOOT_H: 5,
  LABEL: { x: -140, y: 53, w: 36, d: 10, r: 1 },
  RULER: { x: -24, y: 60, w: 52, d: 4.6, r: 0.8 },
  FRAME_X0: -140,
  FRAME_X1: 140,
  FRAME_T: 4,
  FRAME_Y0: -50, // 뒤 옆판 plan 의 y
  FRAME_Y1: 50, // 앞 옆판 바깥면
  FRAME_TOP: 20,
  PILLOW_TOP: 44,
  FRAME_Y0_INNER_FRONT: 46, // 앞 받침 안쪽 면 — 축이 여기까지 보인다
  ZC: 36, // 두루마리·드럼 축 높이
  R: 14, // 두루마리·드럼(감긴 종이) 반지름
  ZT: 50, // 글쓰기 판 윗면 = 종이 높이
  ZP: 50,
  SUPPLY_X: -118,
  DRUM_X: 118,
  PAPER_HALF: 42,
  CORE_R: 5,
  SPINDLE_R: 2.4,
  FLANGE_R: 16,
  KNOB_Y0: 53,
  KNOB_Y1: 59,
  KNOB_R: 6,
  GEAR_Y0: 54,
  GEAR_Y1: 57,
  GEAR_R: 13,
  PINION_R: 4,
  PINION_Z: 19, // ZC - GEAR_R - PINION_R
  MOTOR_R: 6.5,
  MOTOR_Y1: 53.4,
  PLATEN: { x: -100, y: -48, w: 196, d: 96, r: 2 },
  GRID_Y0: -30,
  GRID_Y1: 36,
  GRID_DY: 6,
  GRID_DX: 8,
  B: 0, // 바늘 영점(기준선)의 y
  PIVOT: [-90, 0], // 팔이 길수록 바늘 끝이 그리는 호가 덜 휜다(튐이 초승달이 아니라 봉우리로 읽힌다)
  ARM_L: 100,
  ARM_Z: 56,
  BACK_POST_Y: -58,
  FRONT_POST_Y: 56,
  BAR: { x: -94, y: -62, w: 8, d: 122, r: 1.5 },
  BAR_Z: 74,
  BAR_H: 5,
  GALVO_R: 11,
  GALVO_H: 14,
  KNOB_GALVO_R: 4,
  KNOB_TOP: 100,
  STAMP_X: 44,
  STAMP_POST_Y: -57,
  STAMP_ARM_Z: 84,
  MARK_Y: -36, // 뒤 여백(도장 칸) 가운데 — 앞에 두면 도장 기둥이 화면에서 펜 뒤 선을 가린다
  SOL_R: 7,
  SOL_Z0: 70,
  HEAD: { w: 20, d: 12, h: 6, pad: 1.2 },
  REST: 60, // 도장 고무 바닥 — 쉬는 높이
  SPEED_KNOB: [70, 35], // 종이 속도 선택 손잡이(글쓰기 판 앞면) — x, z
};

// 한 바퀴 = 12.5초: 인트로 2.5초(t 0~0.2) + 아웃트로 10초(t 0.2~1). 영상은 frame/30 → 초.
const LOOP = { seconds: 12.5, intro: [0, 0.2], outro: [0.2, 1] };

const V1 = 40; // 인트로 종이 속도(세계 단위/초)
const V2 = 4; // 아웃트로 종이 속도 — 천천히 흐른다
const DEC0 = 1.8;
const DEC1 = 2.5;
const QS = 20; // 크게 튀기 시작하는 종이 위치(= 인트로 0.5초)
const RISE = 2.5;

function speedAt(T) {
  if (T <= DEC0) return V1;
  if (T >= DEC1) return V2;
  const s = (T - DEC0) / (DEC1 - DEC0);
  return V2 + (V1 - V2) * (1 + Math.cos(Math.PI * s)) / 2;
}

// 종이가 지금까지 나간 길이 P(T) — speedAt 의 적분(닫힌 식)
function paperAt(T) {
  if (T <= DEC0) return V1 * T;
  const span = DEC1 - DEC0;
  if (T >= DEC1) return V1 * DEC0 + V2 * span + ((V1 - V2) / 2) * span + V2 * (T - DEC1);
  const d = T - DEC0;
  const s = d / span;
  return V1 * DEC0 + V2 * d + ((V1 - V2) / 2) * (d + (span / Math.PI) * Math.sin(Math.PI * s));
}

const smooth01 = (a, b, x) => {
  const u = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return u * u * (3 - 2 * u);
};

// 잔잔한 흔들림 — 종이 위치 q 의 함수. 아웃트로 쪽(q > 80)은 잔떨림을 줄여 잔잔하게
function calm(q) {
  const quiet = 1 - 0.8 * smooth01(76, 92, q);
  return 1.7 * Math.sin((2 * Math.PI * q) / 9.7 + 0.6) + quiet * (1.0 * Math.sin((2 * Math.PI * q) / 4.1 + 2.1) + 0.55 * Math.sin((2 * Math.PI * q) / 2.3 + 0.9));
}
// 크게 튐 — 확 뛰고 울리며 잦아든다(뒤쪽 -y, 도장 칸 쪽으로 튄다)
function spike(q) {
  const d = q - QS;
  if (d <= 0) return 0;
  // 2.5 단위 만에 곧게 치솟고(바늘 호가 종이 이동을 거의 상쇄해 거의 수직으로 선다) 꼭지에서 꺾여 울린다
  if (d < RISE) return -28 * (d / RISE);
  const e = d - RISE;
  return -28 * Math.exp(-e / 2.6) * Math.cos((2 * Math.PI * e) / 5.2);
}
const peakD = (() => {
  let best = 0;
  let value = 0;
  for (let d = 0; d <= 10; d += 0.005) if (spike(QS + d) < value) [best, value] = [d, spike(QS + d)];
  return best;
})();

// 튐의 꼭지가 쓰인 종이 위치 — 펼친 종이 띠(stripSvg)에서 도장 자국을 이 자리에 둔다
const PEAK_Q = QS + peakD;

const tipX = (y) => W.PIVOT[0] + Math.sqrt(W.ARM_L * W.ARM_L - (y - W.B) * (y - W.B));

// 도장이 찍히는 순간: 튄 꼭지가 도장 한가운데(x = STAMP_X) 아래에 오는 종이 위치
const HIT = (() => {
  const yPeak = W.B + calm(QS + peakD) + spike(QS + peakD);
  const P = W.STAMP_X - tipX(yPeak) + QS + peakD;
  let lo = 0;
  let hi = DEC1;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (paperAt(mid) < P) lo = mid;
    else hi = mid;
  }
  return { P, T: (lo + hi) / 2 };
})();

// 도장 충격이 바늘에 전해진 작은 떨림 — 기록계는 자기 충격까지 기록한다
function shock(q) {
  const d = q - HIT.P;
  if (d <= 0) return 0;
  return 1.6 * Math.exp(-d / 1.1) * Math.sin(2 * Math.PI * d / 1.0);
}

const signal = (q) => W.B + calm(q) + spike(q) + shock(q);

const DOWN = 0.13;
const DWELL = 0.08;
function stampZ(T) {
  const hit = W.ZP;
  const t0 = HIT.T - DOWN;
  if (T <= t0) return W.REST;
  if (T <= HIT.T) {
    const s = (T - t0) / DOWN;
    return W.REST - (W.REST - hit) * s * s;
  }
  if (T <= HIT.T + DWELL) return hit;
  const s = T - HIT.T - DWELL;
  const x = 1 - Math.exp(-7 * s) * (Math.cos(11 * s) + (7 / 11) * Math.sin(11 * s));
  return hit + (W.REST - hit) * x;
}

function pose(t) {
  const u = Math.min(1, Math.max(0, t));
  const T = u * LOOP.seconds;
  const P = paperAt(T);
  const y = signal(P);
  return {
    t: u,
    T,
    P,
    speed: speedAt(T),
    tip: [tipX(y), y],
    theta: Math.asin((y - W.B) / W.ARM_L),
    stampZ: stampZ(T),
    stamped: T >= HIT.T,
    markS: W.STAMP_X + (P - HIT.P),
    // 속도 손잡이 지시선 각(위에서 +x 쪽으로): 빠름 +50° · 느림 -50°
    speedAngle: ((speedAt(T) - V2) / (V1 - V2) - 0.5) * (100 * Math.PI / 180),
  };
}

// 「눈만」 마크 — personal-sloth-brand/src/marks.tsx 의 FACE 기하(200×200)를 다각형으로 옮겼다.
// 종이 위에 찍히므로 점 목록으로 들고 다닌다(평평한 구간·드럼 곡면 어디서든 같은 식으로 투영된다).
const MARK = (() => {
  const patch = { cx: 100, cy: 96 };
  const eye = { dx: 27, rx: 13, ry: 15 };
  const brow = { dx: 28, dy: -25, w: 26, h: 6.5, tilt: 11 };
  const ink = [];
  const holes = [];
  const ellipse = (cx, cy, rx, ry, n = 28) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos((i / n) * 2 * Math.PI), cy + ry * Math.sin((i / n) * 2 * Math.PI)]);
  for (const side of [-1, 1]) {
    // 눈썹: 끝이 둥근 막대를 side * tilt 만큼 돌린다(돌림 중심 = 눈썹 안쪽 끝)
    const px = patch.cx + side * brow.dx;
    const py = patch.cy + brow.dy;
    const x0 = side > 0 ? px : px - brow.w;
    const r = brow.h / 2;
    const cap = (cx, from) => Array.from({ length: 9 }, (_, i) => [cx + r * Math.cos(from + (i / 8) * Math.PI), py + r + r * Math.sin(from + (i / 8) * Math.PI)]);
    const bar = [...cap(x0 + brow.w - r, -Math.PI / 2), ...cap(x0 + r, Math.PI / 2)];
    const a = (side * brow.tilt * Math.PI) / 180;
    ink.push(bar.map(([x, y]) => [px + (x - px) * Math.cos(a) - (y - py) * Math.sin(a), py + (x - px) * Math.sin(a) + (y - py) * Math.cos(a)]));
    ink.push(ellipse(patch.cx + side * eye.dx, patch.cy, eye.rx, eye.ry));
    holes.push(ellipse(patch.cx + side * eye.dx + 4.5, patch.cy - 5.5, 3.8, 3.8, 14));
  }
  ink.push([[100, 112], [89, 120], [89.1, 122.1], [90, 123], [110, 123], [110.9, 122.1], [111, 120]]);
  // 종이 단위로: 폭(눈썹 바깥 끝 사이 약 110)을 18 단위로, 가운데를 원점으로
  const scale = 18 / 110;
  const centre = [100, 95];
  const toPaper = (list) => list.map((shape) => shape.map(([x, y]) => [(x - centre[0]) * scale, (y - centre[1]) * scale]));
  return { ink: toPaper(ink), holes: toPaper(holes) };
})();

const PROJ = {"origin":[320,215.29256604489987],"scale":1.3443741070204567,"azimuth":58,"elevation":30};
// 기록계 라이브 코드 — kit(iso-kit) · model.mjs 뒤에 이어 붙는다. PROJ 는 빌드가 넣는다.
// window.setPose(t) 하나로 그린다: 같은 t 면 같은 그림. 영상은 frame→t, 웹은 scroll→t.
const stage = document.querySelector(".iso-stage");
const figSvg = stage.querySelector("svg");
const slot = (name) => figSvg.querySelector(`[data-live="${name}"]`);
const readout = document.querySelector("[data-readout]");
const VIEW = (() => {
  const c = cameraOf(PROJ);
  return [c.cosA * c.cosE, c.sinA * c.cosE, c.sinE];
})();
const TAU = Math.PI * 2;
const at3 = (p) => iso(p, PROJ);
const line3 = (points, closed = false) => pathOf(points.map(at3), closed);

/* 종이 길: s 는 판 위 x 좌표를 두루마리·드럼 곡면까지 이어 편 값. s < SUPPLY_X 는 공급 두루마리 위, s > DRUM_X 는 드럼 위 */
const LIMB_BACK = Math.atan2(VIEW[2], VIEW[0]); // 두루마리 뒤쪽 윤곽까지의 각(꼭대기에서 -x 쪽으로)
const LIMB_FRONT = Math.PI - Math.atan2(VIEW[2], VIEW[0]); // 드럼 앞쪽 윤곽까지의 각(꼭대기에서 +x 쪽으로)
const S_MIN = W.SUPPLY_X - W.R * (LIMB_BACK - 0.01);
const S_MAX = W.DRUM_X + W.R * (LIMB_FRONT - 0.01);
function paperPoint(s, y) {
  if (s < W.SUPPLY_X) {
    const phi = (s - W.SUPPLY_X) / W.R;
    return [W.SUPPLY_X + W.R * Math.sin(phi), y, W.ZC + W.R * Math.cos(phi)];
  }
  if (s > W.DRUM_X) {
    const phi = (s - W.DRUM_X) / W.R;
    return [W.DRUM_X + W.R * Math.sin(phi), y, W.ZC + W.R * Math.cos(phi)];
  }
  return [s, y, W.ZP];
}
// s 구간을 곡면에서는 잘게, 평평한 곳은 끝점만 — 한 줄 폴리라인
function sweep(s0, s1, y) {
  const out = [];
  const step = 0.6;
  for (let s = s0; s < s1; s += s < W.SUPPLY_X || s > W.DRUM_X ? step : Math.max(step, Math.min(W.DRUM_X, s1) - s)) out.push(paperPoint(s, y));
  out.push(paperPoint(s1, y));
  return out;
}

/* 고정 눈금(가로줄)은 한 번만 */
const gridRows = (() => {
  const faint = [];
  const major = [];
  const count = Math.round((W.GRID_Y1 - W.GRID_Y0) / W.GRID_DY);
  for (let i = 0; i <= count; i++) {
    const y = W.GRID_Y0 + i * W.GRID_DY;
    (i % 5 === 0 ? major : faint).push(line3(sweep(S_MIN, S_MAX, y)));
  }
  return `<path class="iso-line ink-grid" d="${faint.join("")}"/><path class="iso-line ink-grid-major" d="${major.join("")}"/>`;
})();

const fmt = (v) => (Math.round(v * 100) / 100).toFixed(2);
function inkLayer(p) {
  const out = [gridRows];
  // 시간 세로줄 — 종이에 붙어 흐른다
  const faint = [];
  const major = [];
  const labels = [];
  const n0 = Math.ceil((S_MIN - p.P) / W.GRID_DX);
  const n1 = Math.floor((S_MAX - p.P) / W.GRID_DX);
  for (let n = n0; n <= n1; n++) {
    const s = n * W.GRID_DX + p.P;
    const d = line3([paperPoint(s, W.GRID_Y0), paperPoint(s, W.GRID_Y1)]);
    if (n % 5 === 0) {
      major.push(d);
      // 앞 여백의 두 자리 숫자 — 장식(실제 시각·운영 수치가 아니다). 평평한 구간에서만, 끝에서는 흐려진다
      const fade = Math.min(1, Math.max(0, (s - W.SUPPLY_X - 2) / 10), Math.max(0, (W.DRUM_X - 4 - s) / 10));
      if (fade > 0.02) {
        const label = String(((n / 5) % 100 + 100) % 100).padStart(2, "0");
        labels.push(`<g opacity="${fmt(fade)}">${faceTextSvg(topMatrix([s + 0.8, W.GRID_Y1 + 4.4], W.ZP, PROJ, "x"), label, { size: 2.6, tone: "faint" })}</g>`);
      }
    } else faint.push(d);
  }
  out.push(`<path class="iso-line ink-grid" d="${faint.join("")}"/><path class="iso-line ink-grid-major" d="${major.join("")}"/>`);
  out.push(`<g class="ink-labels">${labels.join("")}</g>`);
  // 도장 자국 — 종이에 붙어 흐른다
  if (p.stamped && p.markS < S_MAX) {
    const toScreen = (shape) => pathOf(shape.map(([mx, my]) => at3(paperPoint(p.markS + mx, W.MARK_Y + my))), true);
    out.push(`<path class="ink-mark" d="${MARK.ink.map(toScreen).join("")}"/><path class="ink-mark-hole" d="${MARK.holes.map(toScreen).join("")}"/>`);
  }
  // 바늘이 지나간 선 — 펜 끝에서 시작해 드럼 윤곽에서 끝난다
  const trace = [];
  const span = S_MAX - W.PIVOT[0] + 10;
  for (let q = p.P; q >= p.P - span; q -= 0.3) {
    const y = signal(q);
    const s = tipX(y) + p.P - q;
    if (s > S_MAX) {
      const prev = trace[trace.length - 1];
      if (prev) trace.push(paperPoint(S_MAX, prev[1]));
      break;
    }
    trace.push(paperPoint(s, y));
  }
  out.push(`<path class="iso-line ink-trace" d="${line3(trace)}"/>`);
  return out.join("");
}

/* 회전 표시 — 축을 따라 도는 부품(y 축) 위의 무늬 */
function ribs(x, z, y0, y1, r, count, phase) {
  const groups = new Map();
  for (let i = 0; i < count; i++) {
    const a = phase + (i / count) * TAU;
    const facing = Math.cos(a) * VIEW[0] + Math.sin(a) * VIEW[2];
    const alpha = Math.min(1, Math.max(0, (facing - 0.05) / 0.35));
    if (alpha < 0.03) continue;
    const key = (Math.round(alpha * 20) / 20).toFixed(2);
    const p = (y) => [x + r * Math.cos(a), y, z + r * Math.sin(a)];
    groups.set(key, (groups.get(key) ?? "") + line3([p(y0), p(y1)]));
  }
  return [...groups].map(([alpha, d]) => `<g opacity="${alpha}"><path class="iso-line" data-tone="lo" d="${d}"/></g>`).join("");
}
const circleY = (x, y, z, r, n = 18) => line3(Array.from({ length: n }, (_, i) => [x + r * Math.cos((i / n) * TAU), y, z + r * Math.sin((i / n) * TAU)]), true);

function rollLayer(p) {
  // 공급 두루마리 심(core) 끝면의 홈 — 종이가 풀리는 만큼 돈다(윗면이 +x 로 가므로 각은 줄어든다)
  const a = Math.PI / 2 - p.P / W.R;
  const face = W.PAPER_HALF + 0.6;
  const from = [W.SUPPLY_X + (W.SPINDLE_R + 0.4) * Math.cos(a), face, W.ZC + (W.SPINDLE_R + 0.4) * Math.sin(a)];
  const to = [W.SUPPLY_X + (W.CORE_R - 0.3) * Math.cos(a), face, W.ZC + (W.CORE_R - 0.3) * Math.sin(a)];
  return `<path class="iso-line" data-tone="lo" d="${line3([from, to])}"/>`;
}
function flangeLayer(p) {
  const a = -p.P / W.R;
  const face = W.PAPER_HALF + 2;
  const holes = [0, 1, 2].map((i) => {
    const b = a + (i / 3) * TAU;
    return circleY(W.DRUM_X + 9.5 * Math.cos(b), face, W.ZC + 9.5 * Math.sin(b), 2.4);
  });
  return `<path class="iso-line" data-tone="lo" d="${holes.join("")}"/>`;
}
const knobLayer = (p) => ribs(W.SUPPLY_X, W.ZC, W.KNOB_Y0 + 0.4, W.KNOB_Y1 - 0.4, W.KNOB_R, 36, Math.PI / 2 - p.P / W.R);
const gearLayer = (p) => ribs(W.DRUM_X, W.ZC, W.GEAR_Y0, W.GEAR_Y1, W.GEAR_R, 52, -p.P / W.R);
function speedLayer(p) {
  const [kx, kz] = W.SPEED_KNOB;
  const face = W.PLATEN.y + W.PLATEN.d + 4.2;
  const a = p.speedAngle;
  const knurl = ribs(kx, kz, face - 3.2, face, 4.4, 24, -a, "y");
  const pointer = line3([[kx + 0.8 * Math.sin(a), face, kz + 0.8 * Math.cos(a)], [kx + 3.6 * Math.sin(a), face, kz + 3.6 * Math.cos(a)]]);
  return `${knurl}<path class="iso-line" data-tone="hi" d="${pointer}"/>`;
}
const pinionLayer = (p) => ribs(W.DRUM_X, W.PINION_Z, W.GEAR_Y0, W.GEAR_Y1, W.PINION_R, 16, (p.P / W.R) * (W.GEAR_R / W.PINION_R));

/* 바늘: 갈바노미터 축에서 나온 팔(밝은 선) + 펜 끝 */
function needleLayer(p) {
  const [px, py] = W.PIVOT;
  const dir = [Math.cos(p.theta), Math.sin(p.theta)];
  const tail = [px - dir[0] * 7, py - dir[1] * 7, W.ARM_Z];
  const tip = [p.tip[0], p.tip[1], W.ARM_Z];
  const out = [`<path class="iso-line needle-arm" data-tone="lit" data-free="start" d="${line3([tail, tip])}"/>`];
  out.push(solidSvg(cylinder(tail[0], tail[1], 1.8, W.ARM_Z - 1.4, 2.8, PROJ, 16), { tone: "mid" }));
  out.push(solidSvg(cylinder(p.tip[0], p.tip[1], 0.9, W.ZP, W.ARM_Z - 1 - W.ZP, PROJ, 14), { tone: "hi", lit: true, crease: "none" }));
  out.push(solidSvg(cylinder(p.tip[0], p.tip[1], 1.9, W.ARM_Z - 1, 3.4, PROJ, 20), { tone: "hi", lit: true }));
  return out.join("");
}

/* 도장: 그림자 → 고무(잉크) → 머리 → 용수철 뒤 → 막대 → 용수철 앞 */
function vcoil(cx, cy, r, z0, z1, turns) {
  const back = [];
  const front = [];
  const n = Math.max(8, Math.round(turns * 16));
  let run = [];
  let side = null;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * turns * TAU;
    const p = [cx + r * Math.cos(a), cy + r * Math.sin(a), z0 + (z1 - z0) * (i / n)];
    const facing = Math.cos(a) * VIEW[0] + Math.sin(a) * VIEW[1] >= 0;
    if (side !== null && facing !== side) {
      run.push(p);
      (side ? front : back).push(line3(run));
      run = [];
    }
    side = facing;
    run.push(p);
  }
  if (run.length > 1) (side ? front : back).push(line3(run));
  return { back: back.join(""), front: front.join("") };
}
function stampLayer(p) {
  const z = p.stampZ;
  const H = W.HEAD;
  const plan = { x: W.STAMP_X - H.w / 2, y: W.MARK_Y - H.d / 2, w: H.w, d: H.d, r: 1.6 };
  const near = 1 - (z - W.ZP) / (W.REST - W.ZP);
  const out = [];
  // 그림자는 곱하기로 — 눈금선을 덮지 않고 어둡게만 한다(덮으면 안개처럼 하얗게 보인다)
  out.push(`<path class="iso-halo" d="${haloOf(insetPlan(plan, 1.5), W.ZP, 0.1, PROJ)}" style="opacity:${fmt(0.1 + 0.45 * near)};filter:blur(${fmt(4.5 - 3 * near)}px);mix-blend-mode:multiply"/>`);
  out.push(solidSvg(slabOf(insetPlan(plan, 0.7), z, H.pad, PROJ, 3), { tone: "mid", className: "ink-pad", crease: "none" }));
  out.push(solidSvg(slabOf(plan, z + H.pad, H.h, PROJ, 3, 0.5), { tone: "hi", inner: lineSvg(sideSeam(plan, z + H.pad + 2.2, PROJ, 3), { tone: "faint" }) }));
  const top = z + H.pad + H.h;
  out.push(dotsSvg([at3([plan.x + 2.4, plan.y + 2.4, top]), at3([plan.x + plan.w - 2.4, plan.y + 2.4, top]), at3([plan.x + 2.4, plan.y + plan.d - 2.4, top]), at3([plan.x + plan.w - 2.4, plan.y + plan.d - 2.4, top])], { size: 0.45 }));
  out.push(solidSvg(cylinder(W.STAMP_X, W.MARK_Y, 3, top, 1.2, PROJ, 20), { tone: "mid" }));
  const coil = vcoil(W.STAMP_X, W.MARK_Y, 2.7, top + 1.2, W.SOL_Z0 - 1.2, 5);
  out.push(lineSvg(coil.back, { tone: "lo" }));
  out.push(solidSvg(cylinder(W.STAMP_X, W.MARK_Y, 1.4, top + 1.2, W.SOL_Z0 - 1.2 - top - 1.2, PROJ, 16), { tone: "mid", crease: "none" }));
  out.push(lineSvg(coil.front, { tone: "mid" }));
  return out.join("");
}

const slots = Object.fromEntries(["ink", "roll", "flange", "knob", "gear", "pinion", "needle", "stamp", "speed"].map((name) => [name, slot(name)]));
let shown = -1;
function setPose(t) {
  const p = pose(t);
  slots.ink.innerHTML = inkLayer(p);
  slots.roll.innerHTML = rollLayer(p);
  slots.flange.innerHTML = flangeLayer(p);
  slots.knob.innerHTML = knobLayer(p);
  slots.gear.innerHTML = gearLayer(p);
  slots.pinion.innerHTML = pinionLayer(p);
  slots.needle.innerHTML = needleLayer(p);
  slots.stamp.innerHTML = stampLayer(p);
  slots.speed.innerHTML = speedLayer(p);
  const text = `종이 ${p.speed.toFixed(1)}/s · 도장 ${p.stamped ? 1 : 0}`;
  if (readout && readout.textContent !== text) readout.textContent = text;
  stage.dataset.t = p.t.toFixed(4);
  shown = p.t;
  return p;
}

// 부품 이름별 화면 상자(viewBox 단위) — 같은 이름이 여러 조각(칠하는 순서 때문)이라 합쳐서 돌려준다
function partBox(name) {
  const boxes = [...figSvg.querySelectorAll(`[data-part="${name}"]`)].map((g) => g.getBBox()).filter((b) => b.width > 0);
  if (!boxes.length) return null;
  const x0 = Math.min(...boxes.map((b) => b.x));
  const y0 = Math.min(...boxes.map((b) => b.y));
  const x1 = Math.max(...boxes.map((b) => b.x + b.width));
  const y1 = Math.max(...boxes.map((b) => b.y + b.height));
  return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
}

/* 펼친 종이 띠 — 웹 스크롤 타임라인용. 가로 = 종이가 쓰인 순서 q(왼쪽이 오래된 쪽), 세로 = 종이 폭(위가 도장 여백).
   눈금은 8 단위마다 반복, 선은 signal(q) 그대로라 길이를 얼마로 늘려도 이어진다. 끝은 양쪽 모두 종이 끝(세로선)에서 닫힌다.
   upTo 를 주면 그 위치까지만 쓰인 선(바늘이 아직 안 간 곳은 빈 종이) — scroll→q 로 쓰면 된다. */
function stripSvg({ from = 0, to = 200, upTo = to, label = true } = {}) {
  const H = W.PAPER_HALF;
  const x = (q) => (q - from).toFixed(2);
  const out = [];
  out.push(`<rect x="0" y="${-H}" width="${(to - from).toFixed(2)}" height="${2 * H}" fill="var(--solhun-chart, #FFFCF8)" stroke="var(--anatomy-lo, #B8B0A9)" stroke-width=".5" vector-effect="non-scaling-stroke"/>`);
  const rows = [];
  for (let y = W.GRID_Y0, i = 0; y <= W.GRID_Y1 + 1e-6; y += W.GRID_DY, i++) rows.push(`<path d="M0 ${y}H${x(to)}" stroke="var(${i % 5 === 0 ? "--solhun-grid-major, #A8B8A7" : "--solhun-grid, #D5DDD1"})"/>`);
  const cols = [];
  for (let n = Math.ceil(from / W.GRID_DX); n * W.GRID_DX <= to; n++) {
    const q = n * W.GRID_DX;
    cols.push(`<path d="M${x(q)} ${W.GRID_Y0}V${W.GRID_Y1}" stroke="var(${n % 5 === 0 ? "--solhun-grid-major, #A8B8A7" : "--solhun-grid, #D5DDD1"})"/>`);
    if (label && n % 5 === 0) cols.push(`<text x="${(q - from + 0.8).toFixed(2)}" y="${W.GRID_Y1 + 4.4}" font-size="2.6" font-family="ui-monospace,Menlo,monospace" fill="var(--solhun-label, #9DAE9C)">${String(((n / 5) % 100 + 100) % 100).padStart(2, "0")}</text>`);
  }
  out.push(`<g fill="none" stroke-width=".5" vector-effect="non-scaling-stroke">${rows.join("")}${cols.join("")}</g>`);
  const end = Math.min(to, upTo);
  if (end > from) {
    const pts = [];
    for (let q = from; q < end; q += 0.3) pts.push(`${x(q)} ${signal(q).toFixed(2)}`);
    pts.push(`${x(end)} ${signal(end).toFixed(2)}`);
    out.push(`<path d="M${pts.join("L")}" fill="none" stroke="var(--anatomy-hi, #1E2834)" stroke-width=".85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`);
  }
  if (PEAK_Q >= from && PEAK_Q <= to && HIT.P <= upTo) {
    const shape = (list) => list.map((pts) => `M${pts.map(([mx, my]) => `${(PEAK_Q - from + mx).toFixed(2)} ${(W.MARK_Y + my).toFixed(2)}`).join("L")}Z`).join("");
    out.push(`<path d="${shape(MARK.ink)}" fill="var(--solhun-moss, #4B6250)" opacity=".93"/><path d="${shape(MARK.holes)}" fill="var(--solhun-chart, #FFFCF8)"/>`);
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 ${-H} ${(to - from).toFixed(2)} ${2 * H}" preserveAspectRatio="xMinYMid meet" role="img" aria-label="기록지 — 흔들림 선과 깨진 자리의 도장">${out.join("")}</svg>`;
}

window.setPose = setPose;
window.recorder = { setPose, partBox, stripSvg, pose, project: at3, paperPoint, loop: LOOP, hit: HIT, peakQ: PEAK_Q, parts: ["base", "frame", "supply", "platen", "paper", "drum", "needle", "stamp"] };

/* 재생: ?t=0.42 면 그 순간에 멈춘다. 없으면 한 바퀴씩 돈다(화면 밖에서는 쉰다). 움직임 줄이기면 마지막 정지 화면 */
const params = new URLSearchParams(location.search);
if (params.get("bare") === "1") document.body.classList.add("bare");
if (params.get("theme") === "dark") document.body.dataset.theme = "dark";
const still = matchMedia("(prefers-reduced-motion: reduce)");
const fixed = params.has("t") ? Number(params.get("t")) : null;
if (fixed !== null && Number.isFinite(fixed)) setPose(fixed);
else if (params.get("play") === "0" || still.matches || globalThis.RECORDER_NO_PLAY) setPose(1);
else {
  let start = 0;
  let frame = 0;
  let visible = true;
  const tick = (now) => {
    if (!start) start = now - (shown > 0 ? shown * LOOP.seconds * 1000 : 0);
    setPose((((now - start) / 1000) % LOOP.seconds) / LOOP.seconds);
    frame = visible ? requestAnimationFrame(tick) : 0;
  };
  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible && !frame) {
      start = 0;
      frame = requestAnimationFrame(tick);
    }
  }).observe(stage);
  setPose(0);
}
</script></body></html>
