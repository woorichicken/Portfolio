<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>solhun 검수대</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.iso[data-theme="light"]{
  --anatomy-page:#F7ECE4;--anatomy-card:#FBF5EF;--anatomy-text:#4A5462;--anatomy-strong:#1E2834;--anatomy-muted:#7C7F86;
  --anatomy-paper:#FBF5EF;--anatomy-face:#FFFDFA;--anatomy-top:#FFFCF8;
  --anatomy-shade-0:#DFCDB9;--anatomy-shade-1:#E8D9C8;--anatomy-shade-2:#F0E4D7;--anatomy-shade-3:#F7EFE6;
  --anatomy-lit-top:#F8F0E8;--anatomy-lit-shade:#EADDCF;
  --anatomy-hi:#1E2834;--anatomy-mid:#5E6774;--anatomy-lo:#A0948A;--anatomy-faint:#D6C8BA;--anatomy-lit:#4B6250;
  --anatomy-halo:#6E5A48;--anatomy-halo-opacity:.26;--anatomy-dot:#1E2834;
  --anatomy-mono:BenchBody,ui-monospace,monospace;
}
.bench-mark-ink{fill:#1E2834}
.bench-mark-light{fill:#F8F0E8}
.bench-dial-digit{fill:#1E2834;font-family:BenchWord,sans-serif;font-weight:600;font-size:2.5px}
.bench-hub{fill:#1E2834}
.bench-hub-dot{fill:#FFFCF8}
.bench-needle{stroke-width:1.05}
.bench-led{fill:#4B6250}
[data-engraved]{font-family:BenchWord,sans-serif;font-weight:700;letter-spacing:.06em;fill:#1E2834}
.iso-plate-corner{font-family:BenchBody,sans-serif;font-size:12px;letter-spacing:0!important;text-transform:none!important}
.iso-plate-corner[data-corner="fig"],.iso-plate-corner[data-corner="title"]{font-family:BenchWord,sans-serif;font-weight:700;color:#1E2834;font-size:13px}
.iso-plate-corner[data-corner="readout"]{font-variant-numeric:tabular-nums;color:#1E2834}
.iso-plate{border-radius:14px;box-shadow:0 0 0 1px #E2D3C4,0 18px 40px -24px #6E5A4855}
.iso-legend{font-family:BenchBody,sans-serif}
[data-focus] [data-part]{transition:opacity .4s}
[data-focus] [data-part]:not([data-on]){opacity:.18}

*{box-sizing:border-box}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 BenchBody,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

 * solhun 검수대의 「진실」 — anatomy 2단계(Truth first). 화면의 움직임·판독·소리 순간이 전부 여기서 나온다.
 *
 * 채널 한 줄: 「AI 에이전트를 실제 운영에 붙이고, 어디서 깨졌는지 숫자와 증거로 기록」 · 카드 문구 「한 번 더 보고, 근거를 가져옵니다.」
 * 물체 한 문장: 동전을 실은 대차가 레일을 따라 들어와 멈춤쇠에 닿으면(직접 돌려 봄) 다이얼 게이지 머리가 기둥을 타고
 *               두 번 내려와 같은 값을 읽고(한 번 더 확인) 옆 프린터가 표 한 장을 내민다(근거를 가져옴).
 *
 * 게이지가 읽는 것: 머리가 멈춤 고리까지 내려오면 플런저 자유 끝이 받침(anvil) 윗면 = 0 에 온다. 그 위에 동전이 있으면
 * 동전 두께만큼 플런저가 밀려 들어가고, 바늘은 밀려 든 거리를 돈다(한 바퀴 = UNITS_PER_TURN). 그래서 판독 = 동전 두께.
 *
 * 이 파일은 순수 함수만 둔다 — build(그림)·페이지(setPose)·render(영상)·sound(소리 순간)가 같은 값을 쓴다.
 * 같은 t 면 같은 자세(결정적). 시간·난수를 읽지 않는다.
 */

// ── 세계 치수(1 ≈ 실제 물체의 1px) ─────────────────────────────
const ANVIL_TOP = 10.5;          // 대차 위 받침 윗면 = 게이지 0
const COIN_H = 4.2;              // 동전 두께 = 판독값
const COIN_TOP = ANVIL_TOP + COIN_H;
const HEAD_DROP = 9;             // 머리가 위(대기) → 아래(멈춤 고리)까지 내려오는 거리
const TIP_UP = ANVIL_TOP + HEAD_DROP;   // 머리가 위에 있을 때 플런저 자유 끝 높이(동전 위로 4.8 떠 있다)
const PLUNGER_TRAVEL = TIP_UP - COIN_TOP; // 플런저 조각의 이동 거리(4.8) — 이만큼 내려오면 동전에 닿는다
const UNITS_PER_TURN = 6;        // 바늘 한 바퀴 = 6 (작은 눈금 60개 = 0.1 씩)
const CARRIAGE_RUN = 96;         // 대차가 시작 자리에서 게이지 밑까지 가는 거리(x)
const TICKET_RUN = 26;           // 표가 프린터 밖으로 나오는 길이(y)

// ── t 구간(0~1) — README 「t 구간」과 같은 값 ──────────────────
// 인트로 0~0.5 = 75프레임(2.5초 @30fps, f/150), 아웃트로 0.5~1 = 300프레임(10초, 0.5 + f/600).
const INTRO_END = 0.5;
const FPS = 30;
const INTRO_FRAMES = 75;
const OUTRO_FRAMES = 300;
const tOfIntro = (f) => f / (INTRO_FRAMES * 2);
const tOfOutro = (f) => INTRO_END + f / (OUTRO_FRAMES * 2);

// 인트로 안의 순간(인트로 프레임) — 소리도 이 값에 맞춘다(scripts/sound.mjs).
const BEAT = {
  arrive: 16,      // 대차가 멈춤쇠 고무에 닿는다 — 「쿵」이 떨어지는 순간
  press1: [20, 28], // 첫 번째 내려옴 → 확인 1회
  lift: [28, 33],   // 머리를 조금 든다(끝이 동전에서 떨어질 만큼)
  press2: [33, 40], // 두 번째 내려옴 → 확인 2회(같은 값)
  print: [42, 62],  // 표가 나온다 → 근거 1장
};
const LIFT_TO = 0.35;   // 들 때 머리 위치(0 위 ~ 1 아래) — 끝 높이 TIP_UP - 9·0.35 = 16.35 > 동전 14.7

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const smooth = (v) => { const c = clamp01(v); return c * c * (3 - 2 * c); };
const between = (f, [a, b]) => smooth((f - a) / (b - a));
// 대차는 밀려 들어와 멈춤쇠에 「부딪힌다」 — 끝 속도가 0 이 아닌 곡선(코사인을 0.85π 에서 자른다)
const push = (u) => { const c = clamp01(u); return (1 - Math.cos(Math.PI * 0.85 * c)) / (1 - Math.cos(Math.PI * 0.85)); };

/** 머리 위치 h(0 위 · 1 아래)에서 플런저 끝 높이와 밀려 든 거리. 동전은 대차가 다 들어왔을 때만 밑에 있다. */
function contact(h, carriage) {
  const free = TIP_UP - HEAD_DROP * h;
  const surface = carriage >= 1 ? COIN_TOP : -Infinity;
  const tip = Math.max(free, surface);
  return { tip, pushed: Math.max(0, tip - free) };
}

/**
 * 자세 — 조각마다 이동 몫(share)과 바늘·불·판독.
 * share 는 build 의 조각 이동 벡터(move)에 곱한다: carriage [96,0,0] · head [0,0,-9] · plunger [0,0,-4.8] · ticket [0,26,0].
 */
function poseAt(t) {
  const tt = clamp01(t);
  const f = Math.min(tt, INTRO_END) * INTRO_FRAMES * 2;   // 인트로 프레임 축(아웃트로에서는 74.99… 이후 고정)
  const carriage = push(f / BEAT.arrive);
  let head = 0;
  if (f >= BEAT.press1[0]) head = between(f, BEAT.press1);
  if (f >= BEAT.lift[0]) head = 1 - (1 - LIFT_TO) * between(f, BEAT.lift);
  if (f >= BEAT.press2[0]) head = LIFT_TO + (1 - LIFT_TO) * between(f, BEAT.press2);
  const { tip, pushed } = contact(head, carriage);
  const plunger = (TIP_UP - tip) / PLUNGER_TRAVEL;
  const ticket = between(f, BEAT.print);
  // 불 — 인쇄 중에는 켜짐, 쉬는 동안(아웃트로)은 대기 불이 숨 쉰다(쉬는 구간에서 정확히 두 번 — 0.5 와 1 이 같은 값이라 이어 돌려도 튀지 않는다)
  const printing = f >= BEAT.print[0] - 1 && f < BEAT.print[1] + 1 ? 1 : 0;
  const rest = tt > INTRO_END ? (tt - INTRO_END) / (1 - INTRO_END) : 0;
  const breathe = 0.5 - 0.5 * Math.cos(2 * Math.PI * 2 * rest);
  const led = printing ? 1 : f >= BEAT.print[1] + 1 ? 0.35 + 0.65 * breathe : 0;
  const checks = (f >= BEAT.press1[1] ? 1 : 0) + (f >= BEAT.press2[1] ? 1 : 0);
  const tickets = f >= BEAT.print[1] ? 1 : 0;
  return {
    t: tt,
    shares: { carriage, head, plunger, ticket },
    reading: pushed,                                   // 밀려 든 거리 = 지금 읽는 값
    needleDeg: (pushed / UNITS_PER_TURN) * 360,
    turns: Math.floor(pushed / UNITS_PER_TURN + 1e-9),
    led,
    checks,
    tickets,
    phase: f < BEAT.arrive ? (f < 0.5 ? "ready" : "arriving") : checks === 0 ? "pressing" : tickets ? "done" : checks === 1 ? "checked-once" : "printing",
  };
}

// 두 번 잰 값 — 각 누름이 끝나는 순간(머리 1, 대차 1)에 contact 가 돌려주는 밀려 든 거리
const MEASURED = [contact(1, 1).pushed, contact(1, 1).pushed];

/** 판독 — 숫자는 모두 poseAt·contact 가 센 값이다. */
function readoutOf(p) {
  const [a, b] = MEASURED.map((v) => v.toFixed(2));
  if (p.phase === "ready") return "대기 · 확인 0회";
  if (p.phase === "arriving") return "대차 들어오는 중";
  if (p.checks === 0) return `재는 중 · ${p.reading.toFixed(2)}`;
  if (p.checks === 1) return `확인 1회 · ${a}`;
  if (!p.tickets) return `확인 2회 · ${a} = ${b}`;
  return `확인 2회 · 차이 ${Math.abs(MEASURED[0] - MEASURED[1]).toFixed(2)} · 근거 ${p.tickets}장`;
}

const root = document.querySelector("[data-items]");
const nodes = [...root.children].map((el) => ({ el, piece: el.dataset.piece || "", key: +el.dataset.key, lift: +el.dataset.lift, shift: (el.dataset.shift || "0 0").split(" ").map(Number) }));
const needle = document.querySelector("[data-needle]");
const led = document.querySelector("[data-led]");
const readout = document.querySelector("[data-readout]");
const stageEl = document.querySelector(".iso-stage");
let order = nodes.map((_, i) => i).join(",");
function setPose(t) {
  const p = poseAt(t);
  for (const n of nodes) {
    if (!n.piece) continue;
    const s = p.shares[n.piece];
    const dx = n.shift[0] * s, dy = n.shift[1] * s;
    const text = dx || dy ? "translate(" + dx.toFixed(3) + " " + dy.toFixed(3) + ")" : "";
    if (n.text !== text) { text ? n.el.setAttribute("transform", text) : n.el.removeAttribute("transform"); n.text = text; }
    n.el.querySelectorAll("[data-hold]").forEach((h) => (text ? h.setAttribute("transform", "translate(" + (-dx).toFixed(3) + " " + (-dy).toFixed(3) + ")") : h.removeAttribute("transform")));
  }
  const keys = nodes.map((n, i) => [n.key + n.lift * (n.piece ? p.shares[n.piece] : 0), i]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const next = keys.map(([, i]) => i).join(",");
  if (next !== order) { const frag = document.createDocumentFragment(); for (const [, i] of keys) frag.appendChild(nodes[i].el); root.appendChild(frag); order = next; }
  needle.setAttribute("transform", "rotate(" + p.needleDeg.toFixed(3) + ")");
  led.setAttribute("opacity", p.led.toFixed(3));
  const text = readoutOf(p);
  if (readout && readout.textContent !== text) readout.textContent = text;
  if (stageEl) { stageEl.setAttribute("aria-valuenow", p.t.toFixed(3)); stageEl.setAttribute("aria-valuetext", text); }
  document.documentElement.dataset.phase = p.phase;
  return p;
}
window.setPose = setPose;
window.poseAt = poseAt;
// 부품 상자(SVG 좌표) — 웹이 섹션마다 부품 하나를 확대할 때 쓴다. 지금 자세 기준
window.partBox = (name) => {
  const els = [...document.querySelectorAll('[data-part="' + name + '"]')];
  if (!els.length) return null;
  const boxes = els.map((el) => { const b = el.getBBox(); const m = el.transform && el.transform.baseVal.consolidate(); const dx = m ? m.matrix.e : 0, dy = m ? m.matrix.f : 0; return [b.x + dx, b.y + dy, b.x + b.width + dx, b.y + b.height + dy]; });
  const x0 = Math.min(...boxes.map((b) => b[0])), y0 = Math.min(...boxes.map((b) => b[1])), x1 = Math.max(...boxes.map((b) => b[2])), y1 = Math.max(...boxes.map((b) => b[3]));
  return { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
};
// 강조 — 한 부품만 진하게(나머지는 옅게). null 이면 끈다
window.setFocus = (name) => {
  const svgEl = document.querySelector(".iso-svg");
  document.querySelectorAll("[data-part][data-on]").forEach((el) => el.removeAttribute("data-on"));
  if (!name) { svgEl.removeAttribute("data-focus"); return; }
  svgEl.setAttribute("data-focus", name);
  document.querySelectorAll('[data-part="' + name + '"]').forEach((el) => el.setAttribute("data-on", ""));
};

const q = new URLSearchParams(location.search);
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (q.has("t")) setPose(Math.min(1, Math.max(0, Number(q.get("t")) || 0)));
else if (still) setPose(TICKS.introEnd);
else {
  // 한 바퀴: 인트로(0~0.5)를 2.5초에, 쉬는 구간(0.5~1)은 10초 — 그 뒤 쉬는 구간만 이어 돈다(0.5 와 1 의 자세가 같다)
  let start = null, visible = true;
  new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) requestAnimationFrame(tick); }).observe(stageEl);
  function tick(now) {
    if (!visible) return;
    if (start === null) start = now;
    const s = (now - start) / 1000;
    const t = s < 2.5 ? s / 5 : 0.5 + (((s - 2.5) / 10) % 1) * 0.5;
    setPose(t);
    requestAnimationFrame(tick);
  }
  setPose(0);
  requestAnimationFrame(tick);
}

</script></body></html>
